steps:
  # 1. Construir a imagem Docker do backend Ktor
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dyondza-backend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/dyondza-backend:latest', '-f', 'backend/Dockerfile', '.']

  # 2. Enviar a imagem para o Google Container Registry (GCR / Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/dyondza-backend:latest']

  # 3. Fazer o Deploy no Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dyondza-backend'
      - '--image=gcr.io/$PROJECT_ID/dyondza-backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=100'
      # Em produção, adicione a conexão ao Cloud SQL e variáveis de ambiente:
      # - '--add-cloudsql-instances=$PROJECT_ID:us-central1:dyondza-postgres'
      # - '--set-env-vars=DB_URL=jdbc:postgresql:///dyondza?cloudSqlInstance=$PROJECT_ID:us-central1:dyondza-postgres&socketFactory=com.google.cloud.sql.postgres.SocketFactory,DB_USER=postgres,REDIS_HOST=10.0.0.3,REDIS_PORT=6379'

images:
  - 'gcr.io/$PROJECT_ID/dyondza-backend:latest'
