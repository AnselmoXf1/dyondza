steps:
  # 1. Construir a imagem Docker do backend Ktor
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dyondza-backend:latest', '-f', 'backend/Dockerfile', '.']

  # 2. Enviar a imagem para o Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/dyondza-backend:latest']

  # 3. Fazer o Deploy no Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dyondza-backend'
      - '--image=gcr.io/$PROJECT_ID/dyondza-backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=100'

images:
  - 'gcr.io/$PROJECT_ID/dyondza-backend:latest'
